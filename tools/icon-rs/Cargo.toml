[package]
name = "icon-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
flate2 = "1.1.11"
grib = { version = "0.20.3", default-features = false, features = ["ccsds-unpack-with-rust-aec"] }
libm = "0.2.16"
rusty-s3 = "0.11.0"
serde_json = "1.0.154"
tar = "0.4.46"
ureq = "3.5.1"
url = "2"
webp = "0.3.1"
zip = { version = "9.4.1", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
