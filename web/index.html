<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"/>
  <meta name="theme-color" content="#005faf"/>
  <meta name="description" content="OpenWetter: DWD ICON forecast charts and maps with observed radar flowing into the forecast, controlled by swipes."/>
  <link rel="manifest" href="manifest.webmanifest"/>
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml"/>
  <link rel="stylesheet" href="styles.css"/>
  <title>OpenWetter</title>
</head>
<body>
<main class="app" id="appRoot">
  <header class="appbar">
    <button class="place-button" id="placeBtn" aria-label="Open menu and places" aria-expanded="false" aria-controls="drawer">
      <span class="icon" data-icon="menu"></span>
      <span class="place-text"><span id="placeName" class="place-name">Dortmund</span><span id="modelName" class="model-name">DWD ICON</span></span>
    </button>
    <button class="round-button" id="infoBtn" aria-label="Info"><span class="icon" data-icon="info"></span></button>
    <button class="round-button" id="moreBtn" aria-label="More" aria-haspopup="menu"><span class="icon" data-icon="more"></span></button>
  </header>

  <section class="meteo" id="meteo" aria-label="Forecast graphs">
    <div class="extremes" id="extremes" aria-label="Daily maximum and minimum temperatures"></div>
    <div class="graphs" id="graphs"></div>
    <div class="days" id="days" role="group" aria-label="Forecast days"></div>
    <div class="readout" id="readout" aria-live="off">
      <button class="readout-item clock" id="clockBtn" aria-label="Jump to now"><span class="icon" data-icon="clock"></span><span id="readTime">--:--</span></button>
      <div class="readout-item" data-field="temperature"><span class="icon" data-icon="thermo"></span><span id="readTemp">—</span><sup id="unitTemp">°C</sup></div>
      <div class="readout-item" data-field="precipitation"><span class="icon" data-icon="rain"></span><span id="readRain">—</span><sup id="unitRain">mm/h</sup></div>
      <div class="readout-item" data-field="wind"><span class="icon wind-dir" id="windDirIcon" data-icon="windArrow"></span><span id="readWind">—</span><sup id="unitWind">km/h</sup></div>
    </div>
    <div class="time-cursor" id="nowLine" aria-hidden="true"></div>
    <div class="time-cursor selected" id="cursorLine" aria-hidden="true"></div>
  </section>

  <section class="map" id="map" aria-label="Weather map. One finger: change the time. Two fingers: move or zoom the map.">
    <div id="mapSurface" class="map-surface">
      <div id="baseTiles" class="tiles base-tiles"></div>
      <canvas id="iconCanvas" class="layer-canvas"></canvas>
      <canvas id="iconTransitionCanvas" class="layer-canvas crossfade" aria-hidden="true" hidden></canvas>
      <canvas id="radarCanvas" class="layer-canvas"></canvas>
      <canvas id="radarTransitionCanvas" class="layer-canvas crossfade" aria-hidden="true" hidden></canvas>
      <canvas id="warningsCanvas" class="layer-canvas" hidden></canvas>
    </div>
    <div class="center-marker" aria-hidden="true"></div>
    <div class="map-chip" id="mapChip"></div>
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
    <div class="map-bottom">
      <div class="layer-bar card" id="layerBar">
        <button class="source-button" id="sourceBtn" aria-label="Data source"><span class="icon" data-icon="layers"></span></button>
        <div class="layer-buttons" id="layerButtons" role="group" aria-label="Map layers"></div>
        <button class="layer-edit" id="editLayersBtn" aria-label="Edit map menu"><span class="icon" data-icon="add"></span></button>
      </div>
      <button class="legend card" id="legend" aria-label="Edit colour scale"><span class="legend-bar" id="legendBar"></span><span class="legend-ticks" id="legendTicks"></span></button>
    </div>
    <div class="map-credit" id="mapCredit">© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noreferrer">OpenStreetMap</a> · DWD</div>
  </section>

  <div class="scrim" id="scrim" hidden></div>
  <nav class="drawer" id="drawer" aria-label="Menu and places" hidden>
    <div class="drawer-head"><strong>OpenWetter</strong><span>DWD weather, open data</span></div>
    <form class="drawer-search" id="searchForm" role="search">
      <span class="icon" data-icon="search"></span>
      <input id="searchInput" type="search" placeholder="Find a place" autocomplete="off" aria-label="Find a place"/>
    </form>
    <div class="drawer-section">Places</div>
    <div id="placesList" class="places-list"></div>
    <button class="drawer-item" id="addPlaceBtn"><span class="icon" data-icon="star"></span>Save this place</button>
    <button class="drawer-item" id="locateBtn"><span class="icon" data-icon="locate"></span>My location</button>
    <div class="drawer-section">Menu</div>
    <button class="drawer-item" id="settingsBtn"><span class="icon" data-icon="settings"></span>Settings</button>
    <button class="drawer-item" id="offlineBtn"><span class="icon" data-icon="download"></span>Offline maps</button>
    <button class="drawer-item" id="helpBtn"><span class="icon" data-icon="help"></span>Help</button>
  </nav>

  <div class="popup-menu" id="popupMenu" role="menu" hidden></div>
  <div class="dialog-layer" id="dialogLayer" hidden></div>
  <section class="page" id="page" hidden></section>
</main>
<script type="module" src="app.js"></script>
</body>
</html>
