name: Verify Android signing pipeline (throwaway key)
on:
  push:
    branches: [main]
    paths:
      - tools/signing-key.sh
      - .github/workflows/provision-signing.yml
      - .github/workflows/signed-release.yml
      - .github/workflows/signing-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android platform and signing tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Create an ephemeral test-only password
        shell: bash
        run: |
          set -euo pipefail
          printf 'OPENWETTER_SIGNING_PASSPHRASE=%s\n' "$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - name: Test encryption, decryption and signing identity verification
        shell: bash
        run: |
          set -euo pipefail
          bash tools/signing-key.sh generate "$RUNNER_TEMP/openwetter-signing-test"
          bash tools/signing-key.sh decrypt "$RUNNER_TEMP/openwetter-signing-test" "$RUNNER_TEMP/test-release.p12"
          test -s "$RUNNER_TEMP/test-release.p12"
      - name: Build unsigned Android release APK
        run: gradle -p android :app:assembleRelease --stacktrace
      - name: Sign, verify and discard throwaway Android APK
        shell: bash
        run: |
          set -euo pipefail
          UNSIGNED='android/app/build/outputs/apk/release/app-release-unsigned.apk'
          test -s "$UNSIGNED"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f -p 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks "$RUNNER_TEMP/test-release.p12" \
            --ks-key-alias openwetter \
            --ks-pass env:OPENWETTER_SIGNING_PASSPHRASE \
            --key-pass env:OPENWETTER_SIGNING_PASSPHRASE \
            --out "$RUNNER_TEMP/test-signed.apk" "$RUNNER_TEMP/aligned.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$RUNNER_TEMP/test-signed.apk"
          echo 'Throwaway signing round-trip and signed APK verified. No private signing material was published.'
