name: Publish near-native DWD ICON-D2 grids
on:
  schedule:
    - cron: '25 */3 * * *'
  workflow_dispatch:
  push:
    paths:
      - tools/produce_icon.py
      - .github/workflows/icon-data.yml
permissions:
  contents: write
concurrency:
  group: icon-data
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install GRIB decoder and spatial remapping
        run: python -m pip install numpy scipy eccodes
      - name: Build real 15-minute rain and hourly cloud/temperature model grids
        run: python tools/produce_icon.py
      - name: Publish compressed model frames and point series
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config --global user.name 'OpenWetter data service'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
          mkdir -p /tmp/openwetter-published
          mv icon-data/* /tmp/openwetter-published/
          cd /tmp/openwetter-published
          git init -b icon-data
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git add --all
          git commit -m "Refresh genuine 15-minute ICON-D2 fields at run ${GITHUB_RUN_ID}"
          git push --force origin HEAD:refs/heads/icon-data
