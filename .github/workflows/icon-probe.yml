name: Probe official ICON grids
on:
  push:
    paths:
      - tools/icon_probe.py
      - .github/workflows/icon-probe.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install GRIB decoder
        run: python -m pip install eccodes numpy
      - name: Inspect official DWD ICON-D2 GRIB2 field grids
        run: python tools/icon_probe.py
