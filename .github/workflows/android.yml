name: Test and build OpenWetter
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  web-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax and run unit tests
        run: |
          node --check web/app.js
          node --check web/logic.mjs
          node --test web/tests/*.test.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright and Chromium
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Run mocked browser interaction tests
        run: python web/tests/browser_test.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: openwetter-browser-previews
          path: screenshots/
  android-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK platform and build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build Android debug APK
        run: gradle -p android :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: openwetter-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  publish-prerelease:
    name: Publish Android prerelease
    if: ${{ github.event_name == 'push' && github.event.head_commit.message == 'Publish OpenWetter v0.1.0-alpha.4 prerelease' }}
    needs: [web-tests, android-build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download CI-built Android APK
        uses: actions/download-artifact@v4
        with:
          name: openwetter-debug-apk
          path: dist
      - name: Validate and name APK
        run: |
          test -s dist/app-debug.apk
          mv dist/app-debug.apk dist/OpenWetter-v0.1.0-alpha.4-debug.apk
          unzip -t dist/OpenWetter-v0.1.0-alpha.4-debug.apk
          (cd dist && sha256sum OpenWetter-v0.1.0-alpha.4-debug.apk > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt
      - name: Publish GitHub prerelease with APK and SHA-256
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.1.0-alpha.4 \
            dist/OpenWetter-v0.1.0-alpha.4-debug.apk \
            dist/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "OpenWetter v0.1.0-alpha.4 (Android preview)" \
            --notes-file .github/RELEASE_NOTES.md \
            --prerelease
