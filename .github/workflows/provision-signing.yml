name: Provision OpenWetter signing key (one time)
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openwetter-signing-identity
  cancel-in-progress: false

jobs:
  provision:
    if: github.repository == 'e-kotov/OpenWetter' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Generate, encrypt and verify private Android signing key
        env:
          OPENWETTER_SIGNING_PASSPHRASE: ${{ secrets.OPENWETTER_SIGNING_PASSPHRASE }}
        shell: bash
        run: bash tools/signing-key.sh generate signing
      - name: Commit only encrypted private key and public certificate
        shell: bash
        run: |
          set -euo pipefail
          test -s signing/openwetter-release.p12.gpg
          test -s signing/openwetter-release.pem
          git config user.name 'OpenWetter signing provisioner'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add signing/openwetter-release.p12.gpg signing/openwetter-release.pem
          git diff --cached --quiet && {
            echo '::error::Expected new encrypted signing identity.'; exit 1;
          }
          git commit -m 'Provision encrypted OpenWetter signing identity'
          git push origin HEAD:refs/heads/main
          {
            echo '## OpenWetter signing identity created'
            echo
            echo 'Only the GPG-encrypted keystore and its public certificate were committed.'
            echo 'Preserve the strong repository secret in your password manager and back up the .gpg file.'
            echo
            openssl x509 -in signing/openwetter-release.pem -noout -fingerprint -sha256
          } >> "$GITHUB_STEP_SUMMARY"
