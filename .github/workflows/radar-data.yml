name: Publish original 1 km DWD radar observations
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    paths:
      - tools/produce_radar.py
      - .github/workflows/radar-data.yml
permissions:
  contents: write
concurrency:
  group: radar-data
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install HDF5 radar and projection libraries
        run: python -m pip install numpy h5py pyproj
      - name: Reuse previously processed radar frames
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone --quiet --depth 1 --branch radar-data \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            /tmp/openwetter-radar-cache
          mkdir -p radar-data/frames
          cp -a /tmp/openwetter-radar-cache/frames/. radar-data/frames/
      - name: Download and decode new DWD RY five-minute radar frames
        run: python tools/produce_radar.py
      - name: Publish incremental radar frame changes
        run: |
          set -euo pipefail
          git config --global user.name 'OpenWetter data service'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rsync -a --delete --exclude='.git' radar-data/ /tmp/openwetter-radar-cache/
          cd /tmp/openwetter-radar-cache
          git add --all
          if git diff --cached --quiet; then
            echo 'No new DWD radar frames'
            exit 0
          fi
          if [ "$((GITHUB_RUN_NUMBER % 144))" -eq 0 ]; then
            # Periodic history compaction: restart the disposable data branch
            # from a fresh root without keeping thousands of commits.
            root=$(printf 'Compact latest DWD radar snapshot\n' | git commit-tree "$(git write-tree)")
            git push --force origin "${root}:refs/heads/radar-data"
          else
            git commit -m "Update DWD 1 km radar five-minute frames ${GITHUB_RUN_ID}"
            git push origin HEAD:refs/heads/radar-data
          fi
