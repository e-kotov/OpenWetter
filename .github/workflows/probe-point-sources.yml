name: Probe live DWD and point forecast endpoints
on:
  push:
    paths:
      - tools/probe_point_sources.py
      - .github/workflows/probe-point-sources.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check live published DWD point series and Open-Meteo API
        run: python tools/probe_point_sources.py
